# IA: Archivo de configuracion creado con ayuda de la IA (Claude)
# Nivel raiz: muestra INFO, WARN y ERROR. Salidas: consola y fichero
log4j.rootLogger=INFO, consola, fichero

# Configuracion de la consola
log4j.appender.consola=org.apache.log4j.ConsoleAppender
log4j.appender.consola.layout=org.apache.log4j.PatternLayout
log4j.appender.consola.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1} - %m%n

# Configuracion del fichero
log4j.appender.fichero=org.apache.log4j.RollingFileAppender
log4j.appender.fichero.File=hotel.log
log4j.appender.fichero.MaxFileSize=5MB
log4j.appender.fichero.MaxBackupIndex=3
log4j.appender.fichero.layout=org.apache.log4j.PatternLayout
log4j.appender.fichero.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1} - %m%n